<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Simplifex</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container">
    <a href="/" class="brand"><span class="brand-mark">S</span>Simplifex</a>
    <div class="nav-links">
      <a href="/cadastro.html">Criar conta</a>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="form-card">
      <h2>Entrar na sua conta</h2>
      <div class="form-error" id="erro"></div>
      <form id="form-login">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <p style="margin-top:16px;font-size:0.9rem;text-align:center;">
        Não tem conta? <a href="/cadastro.html">Criar conta grátis</a>
      </p>
    </div>
  </div>
</section>

<script src="/assets/js/config.js"></script>
<script type="module">
  import { entrar } from '/assets/js/auth.js';

  const form = document.getElementById('form-login');
  const erroEl = document.getElementById('erro');

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    erroEl.style.display = 'none';
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      await entrar({ email: form.email.value, senha: form.senha.value });
      window.location.href = '/dashboard.html';
    } catch (err) {
      erroEl.textContent = err.message === 'Invalid login credentials'
        ? 'E-mail ou senha incorretos.'
        : err.message;
      erroEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
